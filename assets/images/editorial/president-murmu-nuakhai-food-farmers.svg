<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">President Murmu’s Nuakhai message on food, farmers and nature</title>
<desc id="desc">Lex Talk Legal editorial banner showing ripe paddy fields, grain, a farmer silhouette and natural-resource imagery, reflecting President Droupadi Murmu’s Nuakhai remarks in Raipur.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101923"/><stop offset=".58" stop-color="#203b34"/><stop offset="1" stop-color="#46311a"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b51228"/><stop offset="1" stop-color="#ef454b"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#efbe37"/><stop offset="1" stop-color="#ffe18a"/></linearGradient>
  <pattern id="grain" width="25" height="25" patternUnits="userSpaceOnUse"><circle cx="5" cy="6" r="1" fill="#fff" opacity=".06"/><circle cx="20" cy="18" r="1" fill="#fff" opacity=".04"/></pattern>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grain)"/>
