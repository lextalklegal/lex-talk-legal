<text x="74" y="159" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="900" fill="#171d26">NUAKHAI FESTIVAL • RAIPUR</text>
<text x="54" y="244" font-family="Arial,Helvetica,sans-serif" font-size="47" font-weight="900" fill="#fff">FOOD IS</text>
<text x="54" y="303" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="900" fill="#fff">MORE THAN</text>
<rect x="42" y="323" width="570" height="75" rx="7" fill="url(#red)" transform="rotate(-1 327 360)"/>
<text x="64" y="374" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="900" fill="#fff">JUST FOOD</text>
<text x="54" y="450" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#f4c542">PRESIDENT MURMU'S MESSAGE</text>
<text x="54" y="486" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#e5e7eb">Honour farmers • Protect natural resources</text>
<path d="M54 524H1145" stroke="#fff" stroke-opacity=".2" stroke-width="2"/>
<text x="54" y="560" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#fff">AGRICULTURE • GRATITUDE • COMMUNITY</text>
<text x="54" y="595" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#cbd2d9">Official remarks • Nuakhai celebrations, 22 October 2026</text>
