name: Update Auction Listings

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lex-talk-legal-auctions-update
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - name: Rebuild Auctions from local data
        run: python scripts/build_auctions.py
      - name: Commit Auctions only
        shell: bash
        run: |
          git config user.name "Lex Talk Legal Bot"
          git config user.email "actions@users.noreply.github.com"
          git add auctions/index.html
          if git diff --cached --quiet; then
            echo "No auction changes."
          else
            git commit -m "chore: update manual auction listings"
            git push
          fi
