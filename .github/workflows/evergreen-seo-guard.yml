name: Lex Talk Legal - Evergreen SEO Guard

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "content/evergreen/**"
      - "scripts/validate_evergreen.py"
      - "templates/**"
      - "scripts/build_site.py"
      - "scripts/site_audit.py"
      - "scripts/smoke_test.py"
      - "scripts/build_vc.py"
      - "scripts/refresh_vc_from_onecourt.py"
      - ".github/workflows/refresh-vc-directory.yml"
      - "data/vc_links.json"
      - "courtrooms/index.html"
      - "index.html"
      - "article/**"
      - "category/**"
      - "videos/**"
      - "sitemap.xml"
      - "news-sitemap.xml"
      - "data/articles.json"
      - "src/index.js"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile validators
        run: python -m py_compile scripts/build_site.py scripts/validate_evergreen.py scripts/build_vc.py scripts/refresh_vc_from_onecourt.py scripts/smoke_test.py

      - name: Validate evergreen SEO sources and generated pages
        env:
          LOCAL_BUILD: "1"
        run: python scripts/validate_evergreen.py --verbose

      - name: Build generated pages before smoke tests
        run: python scripts/build_site.py

      - name: Run site smoke tests
        run: python scripts/smoke_test.py

      - name: Audit public HTML metadata, structured data and internal links
        run: python scripts/site_audit.py
