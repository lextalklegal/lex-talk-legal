name: Lex Talk Legal - Sync Blogger and YouTube

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Sync Blogger and YouTube
        env:
          BLOGGER_URL: https://lextalklegal.blogspot.com
          YOUTUBE_HANDLE: "@lextalklegal"
        run: python scripts/build_site.py

      - name: Commit generated content
        run: |
          git config user.name "Lex Talk Legal Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No new content to commit."
          else
            git commit -m "chore: sync Blogger and YouTube"
            git push
          fi
