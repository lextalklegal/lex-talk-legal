name: Deploy Lex Talk Legal Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: lex-talk-legal-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate build
        run: |
          python -m py_compile scripts/build_site.py scripts/smoke_test.py
          python scripts/smoke_test.py

      - name: Deploy Worker and Static Assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
