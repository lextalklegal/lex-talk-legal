name: Deploy Lex Talk Legal Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "data/pib_queue.json"

permissions:
  contents: read

concurrency:
  group: deploy-lex-talk-legal
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate page design contracts
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run repository smoke test
        run: |
          python -m py_compile scripts/build_site.py scripts/build_vc.py scripts/build_auctions.py scripts/build_jobs.py scripts/smoke_test.py
          python scripts/smoke_test.py

      - name: Deploy Worker and static assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
