name: Deploy Lex Talk Legal Worker

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Lex Talk Legal - Editorial Sync"]
    types:
      - completed
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "data/pib_queue.json"
      - "data/x_articles.json"
      - "content/evergreen/**"
      - "templates/category/explained.html"
      - "docs/**"
      - "scripts/build_site.py"

permissions:
  contents: read

concurrency:
  # A failed editorial workflow_run is skipped by the job condition; keep it from cancelling a valid push deployment.
  group: deploy-lex-talk-legal-${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && github.run_id || 'production' }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python for production guard
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install production Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Repair stale public GA tags
        run: python scripts/ensure_public_ga.py

      - name: Synchronize public timestamps to site-wide source of truth
        run: python scripts/sync_public_timestamps.py

      - name: Validate production build before deploy
        run: |
          python -m py_compile scripts/build_site.py scripts/smoke_test.py scripts/ensure_public_ga.py scripts/refresh_site_timestamp.py scripts/sync_public_timestamps.py
          python scripts/smoke_test.py

      - name: Deploy Worker and static assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
