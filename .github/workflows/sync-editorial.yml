name: Lex Talk Legal - Editorial Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: lex-talk-legal-editorial-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install editorial dependencies
        run: pip install beautifulsoup4

      - name: Validate build sources
        run: |
          python -m py_compile scripts/build_site.py scripts/smoke_test.py scripts/ensure_public_ga.py

      - name: Repair stale public GA tags before editorial build
        run: python scripts/ensure_public_ga.py

      - name: Sync Blogger and YouTube only
        env:
          BLOGGER_URL: https://lextalklegal.blogspot.com
          YOUTUBE_HANDLE: "@lextalklegal"
        run: python scripts/build_site.py

      - name: Enforce GA4 coverage after editorial build
        run: python scripts/ensure_public_ga.py

      - name: Validate generated editorial build
        run: |
          python -m py_compile scripts/build_site.py scripts/smoke_test.py scripts/ensure_public_ga.py
          python scripts/smoke_test.py

      - name: Commit editorial outputs only
        shell: bash
        run: |
          git config user.name "Lex Talk Legal Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sitemap.xml news-sitemap.xml data/articles.json data/youtube.json data/site_meta.json article category videos scripts/ensure_public_ga.py
          if git diff --cached --quiet; then
            echo "No editorial changes."
          else
            git commit -m "chore: sync editorial content"
            git push
          fi
