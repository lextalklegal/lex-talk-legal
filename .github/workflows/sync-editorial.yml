name: Lex Talk Legal - Editorial Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "13 */2 * * *"
  push:
    branches:
      - main
    paths:
      - "content/evergreen/**"
      - "templates/category/explained.html"
      - "scripts/build_site.py"
      - "data/x_articles.json"

permissions:
  contents: write

concurrency:
  group: lex-talk-legal-editorial-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install editorial dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      # YouTube-to-blog automatic generation retired on 2026-10-21.
      # Existing generated articles are preserved; only the Blogger/YouTube feed sync below runs.
      - name: Validate build sources
        run: |
          python -m py_compile scripts/build_site.py scripts/generate_youtube_articles.py scripts/smoke_test.py scripts/ensure_public_ga.py

      - name: Repair stale public GA tags before editorial build
        run: python scripts/ensure_public_ga.py

      - name: Sync Blogger and YouTube only
        env:
          BLOGGER_URL: https://lextalklegal.blogspot.com
          YOUTUBE_HANDLE: "@lextalklegal"
        run: python scripts/build_site.py

      - name: Enforce GA4 coverage after editorial build
        run: python scripts/ensure_public_ga.py

      - name: Refresh and synchronize site-wide timestamp
        run: python scripts/refresh_site_timestamp.py --if-content-changed

      - name: Validate generated editorial build
        run: |
          python -m py_compile scripts/build_site.py scripts/generate_youtube_articles.py scripts/smoke_test.py scripts/ensure_public_ga.py
          python scripts/smoke_test.py

      - name: Commit editorial outputs only
        shell: bash
        run: |
          git config user.name "Lex Talk Legal Bot"
          git config user.email "actions@users.noreply.github.com"
          # Bring the branch current before staging generated files. Autostash preserves
          # the build output while rebasing any concurrent main-branch changes.
          git fetch origin main
          git pull --rebase --autostash origin main
          git add index.html sitemap.xml news-sitemap.xml data/articles.json data/youtube.json data/youtube_articles.json data/site_meta.json assets/images/youtube-blog article category videos scripts/ensure_public_ga.py
          git add '*.html' '**/*.html' ':!docs/**'
          if git diff --cached --quiet; then
            echo "No editorial changes."
          else
            git commit -m "chore: sync editorial content"
            git push origin HEAD:main
          fi
