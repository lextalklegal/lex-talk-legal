name: Update Legal Jobs

on:
  push:
    paths:
      - "data/jobs.json"
      - "scripts/build_jobs.py"
      - "templates/jobs.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lex-talk-legal-jobs-update
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - name: Rebuild Jobs from local data
        run: python scripts/build_jobs.py
      - name: Commit Jobs only
        shell: bash
        run: |
          git config user.name "Lex Talk Legal Bot"
          git config user.email "actions@users.noreply.github.com"
          git add jobs/index.html
          if git diff --cached --quiet; then
            echo "No job changes."
          else
            git commit -m "chore: update manual legal jobs"
            git push
          fi
