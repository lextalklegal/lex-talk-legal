name: Update Legal Jobs

on:
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: lex-talk-legal-job-update
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Update manual job data
        env:
          JOB_ACTION: ${{ inputs.action }}
          JOB_ID: ${{ inputs.id }}
          JOB_TITLE: ${{ inputs.title }}
          JOB_ORGANIZATION: ${{ inputs.organization }}
          JOB_LOCATION: ${{ inputs.location }}
          JOB_EMPLOYMENT_TYPE: ${{ inputs.employment_type }}
          JOB_EXPERIENCE: ${{ inputs.experience }}
          JOB_ELIGIBILITY: ${{ inputs.eligibility }}
          JOB_DEADLINE: ${{ inputs.deadline }}
          JOB_POSTED_ON: ${{ inputs.posted_on }}
          JOB_APPLY_URL: ${{ inputs.apply_url }}
          JOB_OFFICIAL_URL: ${{ inputs.official_url }}
          JOB_STATUS: ${{ inputs.status }}
        run: python scripts/manage_job.py
      - name: Rebuild Jobs from local data
        run: python scripts/build_jobs.py
      - name: Validate manual desk
        run: python scripts/smoke_test.py
      - name: Commit job data and page
        shell: bash
        run: |
          git config user.name "Lex Talk Legal Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json jobs/index.html
          if git diff --cached --quiet; then
            echo "No job changes."
          else
            git commit -m "chore: update manual legal jobs"
            git push
          fi
