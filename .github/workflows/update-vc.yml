name: Update Courtroom VC Links

on:
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: lex-talk-legal-vc-update
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Update manual VC data
        env:
          VC_ACTION: ${{ inputs.action }}
          VC_SECTION: ${{ inputs.section }}
          VC_COURT_NAME: ${{ inputs.court_name }}
          VC_LABEL: ${{ inputs.label }}
          VC_URL: ${{ inputs.url }}
          VC_OLD_URL: ${{ inputs.old_url }}
          VC_MEETING_ID: ${{ inputs.meeting_id }}
          VC_PASSWORD: ${{ inputs.password }}
          VC_VERIFIED_ON: ${{ inputs.verified_on }}
          VC_NOTES: ${{ inputs.notes }}
        run: python scripts/manage_vc.py
      - name: Rebuild Courtrooms from local data
        run: python scripts/build_vc.py
      - name: Validate manual desk
        run: python scripts/smoke_test.py
      - name: Commit VC data and page
        shell: bash
        run: |
          git config user.name "Lex Talk Legal Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/vc_links.json courtrooms/index.html
          if git diff --cached --quiet; then
            echo "No VC changes."
          else
            git commit -m "chore: update manual courtroom VC data"
            git push
          fi
