name: Update Courtroom VC Links

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose whether to rebuild the existing base or modify a VC entry"
        required: true
        type: choice
        options:
          - rebuild_existing
          - add_or_update
          - replace_url
          - update_details
          - remove_url
        default: rebuild_existing
      section:
        description: "Section for a NEW entry only"
        required: false
        type: choice
        options:
          - supreme_court
          - high_courts
          - delhi_district
          - drt
          - drat
          - nclt
          - nclat
        default: supreme_court
      court_name:
        description: "Court/bench name for a NEW entry"
        required: false
        type: string
      label:
        description: "Display label"
        required: false
        default: "Join VC"
        type: string
      url:
        description: "New VC URL (only for add/replace)"
        required: false
        type: string
      old_url:
        description: "Existing VC URL to replace/update/remove"
        required: false
        type: string
      meeting_id:
        description: "Meeting ID, if any"
        required: false
        type: string
      password:
        description: "Password, if any"
        required: false
        type: string
      verified_on:
        description: "Verified date (YYYY-MM-DD)"
        required: false
        type: string
      notes:
        description: "Optional notes"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: lex-talk-legal-vc-update
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install VC build dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate scripts
        run: |
          python -m py_compile scripts/manage_vc.py scripts/build_vc.py scripts/smoke_test.py

      - name: Apply manual VC change
        env:
          VC_ACTION: ${{ inputs.action }}
          VC_SECTION: ${{ inputs.section }}
          VC_COURT_NAME: ${{ inputs.court_name }}
          VC_LABEL: ${{ inputs.label }}
          VC_URL: ${{ inputs.url }}
          VC_OLD_URL: ${{ inputs.old_url }}
          VC_MEETING_ID: ${{ inputs.meeting_id }}
          VC_PASSWORD: ${{ inputs.password }}
          VC_VERIFIED_ON: ${{ inputs.verified_on }}
          VC_NOTES: ${{ inputs.notes }}
        run: python scripts/manage_vc.py

      - name: Rebuild Courtrooms from local base data
        run: python scripts/build_vc.py

      - name: Refresh site-wide timestamp
        run: python scripts/refresh_site_timestamp.py

      - name: Validate manual desk
        run: python scripts/smoke_test.py

      - name: Commit only VC changes
        shell: bash
        run: |
          git config user.name "Lex Talk Legal Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/vc_links.json courtrooms/index.html data/site_meta.json
          if git diff --cached --quiet; then
            echo "No VC changes."
          else
            git commit -m "chore: update manual courtroom VC data"
            git push
          fi
