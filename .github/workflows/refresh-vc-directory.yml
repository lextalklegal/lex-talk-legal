name: Refresh Courtroom VC Directory

on:
  schedule:
    # 9:00 PM India Standard Time (15:30 UTC)
    - cron: "30 15 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/refresh_vc_from_onecourt.py"
      - ".github/workflows/refresh-vc-directory.yml"

permissions:
  contents: write

concurrency:
  group: lex-talk-legal-vc-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser and parser
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Refresh directory from OneCourt
        run: python scripts/refresh_vc_from_onecourt.py
      - name: Rebuild courtroom directory
        run: python scripts/build_vc.py
      - name: Validate generated directory
        run: |
          python -m py_compile scripts/refresh_vc_from_onecourt.py scripts/build_vc.py scripts/smoke_test.py
          python scripts/smoke_test.py
      - name: Commit and push changed VC data
        shell: bash
        run: |
          git config user.name "Lex Talk Legal Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git pull --rebase --autostash origin main
          git add data/vc_links.json courtrooms/index.html data/site_meta.json
          if git diff --cached --quiet; then
            echo "VC directory is already up to date; nothing to commit."
          else
            git commit -m "chore: refresh courtroom VC directory from OneCourt"
            git push origin HEAD:main
          fi
